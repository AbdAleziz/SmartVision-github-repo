name: Build SmartVision EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Python 3.8 is the last version that supports Windows 7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: "x64"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.21.6 opencv-python==4.5.5.64 pyautogui==0.9.53 pyzbar==0.1.9
          python -m pip install pyinstaller==4.10 pyinstaller-hooks-contrib==2022.0

      - name: Copy face cascade file
        run: |
          python -c "import cv2,shutil,os; shutil.copy(os.path.join(cv2.data.haarcascades,'haarcascade_frontalface_default.xml'),'.')"

      - name: Build SmartVision (no console window)
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name SmartVision --add-data "haarcascade_frontalface_default.xml;." --hidden-import pyautogui --hidden-import pyzbar.pyzbar smart_vision.py

      - name: Build SmartVisionDebug (with console, shows errors)
        run: |
          python -m PyInstaller --noconfirm --clean --console --name SmartVisionDebug --add-data "haarcascade_frontalface_default.xml;." --hidden-import pyautogui --hidden-import pyzbar.pyzbar smart_vision.py

      - name: Check output
        run: |
          if (!(Test-Path dist/SmartVision/SmartVision.exe)) { throw "SmartVision.exe not found" }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: SmartVision-Windows
          path: dist/
